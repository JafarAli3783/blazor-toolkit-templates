name: release

# Triggers only on semver tags (v1.0.0, v1.2.3-rc.1, etc.).
# Never runs on pull requests.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    name: pack & publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
            nuget-

      - name: Validate tag and extract version
        id: version
        run: |
          # Tag must be vX.Y.Z (optionally with a -prerelease suffix).
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Tag '$TAG' is not a valid vX.Y.Z[-suffix] tag."
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION"

      - name: Bump <Version> / <PackageVersion>
        # Keep Blazor.Toolkit.Templates.csproj in sync with the tag so a
        # manual `dotnet pack` against a fresh checkout produces the
        # same nupkg as the one published by this workflow.
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i.bak -E \
            "s|<Version>[^<]+</Version>|<Version>${VERSION}</Version>|; \
             s|<PackageVersion>[^<]+</PackageVersion>|<PackageVersion>${VERSION}</PackageVersion>|" \
            Blazor.Toolkit.Templates.csproj
          rm -f Blazor.Toolkit.Templates.csproj.bak

      - name: Pack
        run: dotnet pack Blazor.Toolkit.Templates.csproj -c Release --output artifacts/packages --no-restore

      - name: Upload .nupkg as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: templates-package
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 30

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        # --skip-duplicate is a safety net for re-runs of the same tag.
        # If the secret is not configured the step is skipped (workflow
        # still succeeds, artifact is still available for manual publish).
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY secret is not set — skipping NuGet.org publish."
            echo "The .nupkg is still available as a workflow artifact."
            exit 0
          fi
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
